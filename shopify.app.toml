# Production config for https://amberalex-parcel-locker-picker.karolis.workers.dev. Push with `pnpm dlx @shopify/cli app deploy`.
client_id = "e94c913beb6f1e4efd371daf77090f13"
name = "Amber Alex parcel locker picker"
application_url = "https://amberalex-parcel-locker-picker.karolis.workers.dev"
embedded = true

[access_scopes]
# write_shipping: register the carrier service (checkout locker rates)
# read_orders/write_orders: save the chosen locker on new orders
scopes = "write_shipping,read_orders,write_orders"

[auth]
redirect_urls = [ "https://amberalex-parcel-locker-picker.karolis.workers.dev/auth/callback" ]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Needs protected customer data access approved for the app.
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[build]
# Keep `app dev` from replacing the production URLs.
automatically_update_urls_on_dev = false
