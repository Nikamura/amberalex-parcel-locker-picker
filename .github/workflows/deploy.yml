name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # One-off: redeploy right after D1's daily limit resets on 2026-10-31 (the push
  # deploys failed while D1 was blocked). Remove after it has run.
  schedule:
    - cron: "7 0 31 10 *"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec wrangler d1 migrations apply amberalex-parcel-locker-picker --remote
      - run: pnpm exec wrangler deploy
